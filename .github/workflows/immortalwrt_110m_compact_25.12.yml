name: immortalwrt_110m_compact_25.12

# Add a button to trigger the workflow
on: 
  repository_dispatch:
  workflow_dispatch:

  #schedule:
    # UTC 时间对应北京时间（UTC+8=北京时间）：7月20日，早上5点10分 开始编译
    #- cron: '10 21 19 7 *'  
    # UTC 时间对应北京时间：每月2、9、16、23日，早上5点10分 开始编译    
    #- cron: '10 21 1,8,15,22 * *'
    
jobs:
  build:
    # 建议 immortalwrt 使用低版本，更容易编译成功
    runs-on: ubuntu-22.04

    steps:
    - name: Maximize build space
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 2048
        temp-reserve-mb: 512
        swap-size-mb: 2048
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        overprovision-lvm: 'true'
        build-mount-path: '/builder'        

    - name: Prepare Builder Directory
      run: |
        sudo mkdir -p /builder
        sudo chown -R runner:runner /builder
        df -hT

    - name: Checkout repository
      uses: actions/checkout@v7        

    # 如果“Initialization environment”报错，是因为官方 APT 设置依赖项的脚本已经不合时宜，在官方修正之前，请使用下方的代码
    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update
        sudo bash -c 'bash <(curl -s https://build-scripts.immortalwrt.org/init_build_environment.sh)'
        # 强行补充 pahole 和 zstd，确保 DAE 的 BTF 内核可以顺利编译成功
        # sudo apt-get install -y pahole zstd
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo rm -rf /etc/apt/sources.list.d/* /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/graalvm /usr/local/.ghcup \
        /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/node_modules
        sudo timedatectl set-timezone "Asia/Shanghai"
        sudo chown $USER:$GROUPS $GITHUB_WORKSPACE
        
    - name: Check Space
      run: |
        df -h
 # ==================== 把代码放在这里（直接替换原本的 Clone 步骤） ====================
    - name: Clone source code & Configure Feeds
      env:
        REPO_URL:  https://github.com/immortalwrt/immortalwrt
      run: |
        # 拉取源码并切换至正确目录
        git clone -b openwrt-25.12 --single-branch --filter=blob:none $REPO_URL /builder/openwrt || { echo 'Git clone failed!'; exit 1; }
        cd /builder/openwrt   
        
        # 清理潜在的内置冲突
        rm -rf package/feeds/luci/luci-app-passwall package/feeds/packages/passwall package/feeds/luci/luci-app-openclash
        # 强力抹除可能存在冲突的旧版、内置的 dae/daed 源码
        rm -rf package/feeds/luci/luci-app-daed package/feeds/packages/daed package/feeds/packages/dae
        
        # 追加 PassWall 与 OpenClash 官方最新源
        echo "src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main" >> ./feeds.conf.default
        echo "src-git passwall_luci https://github.com/Openwrt-Passwall/openwrt-passwall.git;main" >> ./feeds.conf.default
        echo "src-git openclash https://github.com/vernesong/OpenClash.git;master" >> ./feeds.conf.default
        # 根据仓库信息，追加全新的一体化 daede 专属源
        echo "src-git daede https://github.com/kenzok8/openwrt-daede.git;main" >> ./feeds.conf.default

        #打包
        echo "src-git smpackage https://github.com/kenzok8/small-package" >> ./feeds.conf.default
        
        echo "✅ PassWall 与 OpenClash 官方最新源追加成功！"
    # ====================================================================================
 
    - name: Apply AX6000 110M Layout Modifications
      working-directory: /builder/openwrt
      run: |
        # 1. 在 filogic.mk 末尾追加 Device（红米AX6000 设备定义）
        cat << 'EOF' >> target/linux/mediatek/image/filogic.mk

        define Device/xiaomi_redmi-router-ax6000-110m
          $(Device/xiaomi_redmi-router-ax6000-stock)
          DEVICE_VARIANT := (hanwckf 110M layout)
          DEVICE_DTS := mt7986a-xiaomi-redmi-router-ax6000-110m
          SUPPORTED_DEVICES := xiaomi,redmi-router-ax6000
          IMAGE_SIZE := 112640k
          KERNEL_IN_UBI := 1
          IMAGES := factory.bin sysupgrade.bin
          IMAGE/factory.bin := append-ubi | check-size $$$$(IMAGE_SIZE)
          IMAGE/sysupgrade.bin := sysupgrade-tar | append-metadata
        endef
        TARGET_DEVICES += xiaomi_redmi-router-ax6000-110m
        EOF

        # 2. 创建全新的 immortalwrt 110m大分区 DTS 设备树文件
        cat << 'EOF' > target/linux/mediatek/dts/mt7986a-xiaomi-redmi-router-ax6000-110m.dts
        // SPDX-License-Identifier: (GPL-2.0 OR MIT)

        /dts-v1/;
        #include "mt7986a-xiaomi-redmi-router-ax6000.dtsi"

        / {
        	model = "Xiaomi Redmi Router AX6000 (hanwckf 110M layout)";
        	compatible = "xiaomi,redmi-router-ax6000", "mediatek,mt7986a";
        };

        &spi_nand_flash {
        	mediatek,nmbm;
        	mediatek,bmt-max-ratio = <1>;
        	mediatek,bmt-max-reserved-blocks = <64>;
        };

        &partitions {
        	partition@580000 {
        		label = "crash";
        		reg = <0x580000 0x40000>;
        		read-only;
        	};

        	partition@5c0000 {
        		label = "crash_log";
        		reg = <0x5c0000 0x40000>;
        		read-only;
        	};

        	partition@600000 {
        		label = "ubi";
        		reg = <0x600000 0x6e00000>;
        	};
        };
        EOF

        echo "✅ AX6000 110M 大分区适配代码补丁应用成功！"

    #增加PPOE拨号    
    - name: Pre-configure PPPoE Credentials
      working-directory: /builder/openwrt
      run: |
        # 1. 创建默认网络配置文件覆盖路径
        mkdir -p files/etc/config

        # 2. 动态生成网络配置文件，预设 WAN 口为 PPPoE 拨号，并填入您的账号密码
        cat << 'EOF' > files/etc/config/network
        config interface 'loopback'
        	option device 'lo'
        	option proto 'static'
        	option ipaddr '127.0.0.1'
        	option netmask '255.0.0.0'

        config globals 'globals'
        	option ula_prefix 'fd00:db8:0:1::/64'

        config interface 'lan'
        	option device 'br-lan'
        	option proto 'static'
        	option ipaddr '192.168.100.1'
        	option netmask '255.255.255.0'
        	option ip6assign '60'

        config interface 'wan'
        	option device 'eth1'
        	option proto 'pppoe'
        	option username '7311l7491306'
        	option password '123456'
        	option ipv6 'auto'

        config interface 'wan6'
        	option device 'eth1'
        	option proto 'dhcpv6'
        EOF
        
        echo "✅ PPPoE 账号密码已成功预置进编译文件系统中！"
 
        
    - name: Update feeds
      working-directory: /builder/openwrt
      run: |
        ./scripts/feeds update -a        

    - name: Install feeds
      working-directory: /builder/openwrt
      run: |
        ./scripts/feeds install -a

    
    - name: Configuration Customization - Build_ax6000_immortalwrt_110m_compact_25.12
      env:
        CONFIG_FILE: 'ax6000_immortalwrt_110m_compact.config'
      run: |
        # 1. 复制配置文件到 OpenWrt 编译目录
        [ -e "$CONFIG_FILE" ] && cp "$CONFIG_FILE" /builder/openwrt/.config
        
        # 2. 给根目录下的两个自定义脚本赋予执行权限
        [ -e "./customize_immortalwrt.sh" ] && chmod +x ./customize_immortalwrt.sh
        [ -e "./customize.sh" ] && chmod +x ./customize.sh
        
        # 3. 核心：必须先切入到 openwrt 源码目录，再调用外部脚本执行，确保相对路径100%正确
        cd /builder/openwrt
        
        if [ -e "$GITHUB_WORKSPACE/customize_immortalwrt.sh" ]; then
          echo "🚀 正在执行 customize_immortalwrt.sh..."
          $GITHUB_WORKSPACE/customize_immortalwrt.sh
        fi
        
        if [ -e "$GITHUB_WORKSPACE/customize.sh" ]; then
          echo "🚀 正在执行 customize.sh..."
          $GITHUB_WORKSPACE/customize.sh
        fi
        
        # 4. 刷新并根据脚本修改后的内容自动补全 .config 依赖
        make defconfig
        
        
    - name: Download package
      working-directory: /builder/openwrt
      run: |
        make download -j$(nproc)
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Build firmware
      working-directory: /builder/openwrt
      run: |
        echo -e "$(nproc) thread build."
        # 先尝试多线程全速编译，如果失败（返回非 0 状态码），则触发单线程编译，并打印最详细的 V=s 日志
        make -j$(nproc) || make -j1 V=s

    - name: Check Space
      run: |
        df -h
        
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: ax6000_immortalwrt_110m_compact_25.12
        path: /builder/openwrt/bin
        
    - name: Generate build date tag
      run: |
        echo "BUILD_DATE=$(TZ=Asia/Shanghai date +%Y%m%d-%H%M%S)" >> $GITHUB_ENV
        
    - name: Create Release
      if: success()
      uses: softprops/action-gh-release@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        # 使用你生成的时间戳作为 Tag 名（避免冒号报错）
        tag_name: ${{ env.BUILD_DATE }}
        # 2. 修改 Release 的标题（在最前面加入时间戳）
        name: RedmiAX6000_110m_Compact_25.12_${{ env.BUILD_DATE }}
        generate_release_notes: true
        files: |
          /builder/openwrt/bin/targets/mediatek/filogic/*.bin
          /builder/openwrt/bin/targets/mediatek/filogic/*.manifest
          /builder/openwrt/bin/targets/mediatek/filogic/*.json
    
  
