name: immortalwrt_110m_compact_25.12

# Add a button to trigger the workflow
on: 
  repository_dispatch:
  workflow_dispatch:

  #schedule:
    # UTC 时间对应北京时间（UTC+8=北京时间）：7月20日，早上5点10分 开始编译
    #- cron: '10 21 19 7 *'  
    # UTC 时间对应北京时间：每月2、9、16、23日，早上5点10分 开始编译    
    #- cron: '10 21 1,8,15,22 * *'

env:
  CCACHE_DIR: /builder/ccache
  CCACHE_MAXSIZE: 2G
    
jobs:
  build:
    # 建议 immortalwrt 使用低版本，更容易编译成功
    runs-on: ubuntu-22.04

    steps:
    - name: Maximize build space
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 2048
        temp-reserve-mb: 512
        swap-size-mb: 2048
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        overprovision-lvm: 'true'
        build-mount-path: '/builder'        

    - name: Prepare Builder Directory
      run: |
        sudo mkdir -p /builder /builder/ccache
        sudo chown -R runner:runner /builder
        df -hT

    - name: Checkout repository
      uses: actions/checkout@v7        

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update
        sudo bash -c 'bash <(curl -s https://build-scripts.immortalwrt.org/init_build_environment.sh)' > /dev/null
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo rm -rf /etc/apt/sources.list.d/* /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/graalvm /usr/local/.ghcup \
        /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/node_modules
        sudo timedatectl set-timezone "Asia/Shanghai"
        sudo chown $USER:$GROUPS $GITHUB_WORKSPACE
        
    - name: Check Space
      run: |
        df -h

    - name: Clone source code & Configure Feeds
      env:
        REPO_URL: https://github.com/immortalwrt/immortalwrt
      run: |
        # 拉取源码并切换至正确目录
        git clone -b openwrt-25.12 --single-branch --filter=blob:none $REPO_URL /builder/openwrt || { echo 'Git clone failed!'; exit 1; }
        cd /builder/openwrt   
        
        # 清理潜在的内置冲突
        rm -rf package/feeds/luci/luci-app-passwall package/feeds/packages/passwall package/feeds/luci/luci-app-openclash
        # 强力抹除可能存在冲突的旧版、内置的 dae/daed 源码
        rm -rf package/feeds/luci/luci-app-daed package/feeds/packages/daed package/feeds/packages/dae
        
        # 追加 PassWall 与 OpenClash 官方最新源
        echo "src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main" >> ./feeds.conf.default
        echo "src-git passwall_luci https://github.com/Openwrt-Passwall/openwrt-passwall.git;main" >> ./feeds.conf.default
        echo "src-git openclash https://github.com/vernesong/OpenClash.git;master" >> ./feeds.conf.default
        # 追加全新的一体化 daede 专属源
        echo "src-git daede https://github.com/kenzok8/openwrt-daede.git;main" >> ./feeds.conf.default
        echo "✅ PassWall、OpenClash 与 daede 最新源追加成功！"
 
    - name: Apply AX6000 110M Layout Modifications
      working-directory: /builder/openwrt
      run: |
        # 1. 在 filogic.mk 末尾追加 Device（仅保留 sysupgrade.bin，不生成 factory.bin）
        cat << 'EOF' >> target/linux/mediatek/image/filogic.mk

        define Device/xiaomi_redmi-router-ax6000-110m
          $(Device/xiaomi_redmi-router-ax6000-stock)
          DEVICE_VARIANT := (hanwckf 110M layout)
          DEVICE_DTS := mt7986a-xiaomi-redmi-router-ax6000-110m
          SUPPORTED_DEVICES := xiaomi,redmi-router-ax6000
          IMAGE_SIZE := 112640k
          KERNEL_IN_UBI := 1
          IMAGES := sysupgrade.bin
          IMAGE/sysupgrade.bin := sysupgrade-tar | append-metadata
         
        endef
        TARGET_DEVICES += xiaomi_redmi-router-ax6000-110m
        EOF

        # 2. 创建全新的 immortalwrt 110m大分区 DTS 设备树文件
        cat << 'EOF' > target/linux/mediatek/dts/mt7986a-xiaomi-redmi-router-ax6000-110m.dts
        // SPDX-License-Identifier: (GPL-2.0 OR MIT)

        /dts-v1/;
        #include "mt7986a-xiaomi-redmi-router-ax6000.dtsi"

        / {
        	model = "Xiaomi Redmi Router AX6000 (hanwckf 110M layout)";
        	compatible = "xiaomi,redmi-router-ax6000", "mediatek,mt7986a";
        };

        &spi_nand_flash {
        	mediatek,nmbm;
        	mediatek,bmt-max-ratio = <1>;
        	mediatek,bmt-max-reserved-blocks = <64>;
        };

        &partitions {
        	partition@580000 {
        		label = "crash";
        		reg = <0x580000 0x40000>;
        		read-only;
        	};

        	partition@5c0000 {
        		label = "crash_log";
        		reg = <0x5c0000 0x40000>;
        		read-only;
        	};

        	partition@600000 {
        		label = "ubi";
        		reg = <0x600000 0x6e00000>;
        	};
        };
        EOF

        echo "✅ AX6000 110M 大分区适配代码补丁应用成功！"

    - name: Update & Install feeds
      working-directory: /builder/openwrt
      run: |
        # 静默更新与安装，避免控制台被大量无关信息刷屏
        ./scripts/feeds update -a > /dev/null
        ./scripts/feeds install -a > /dev/null
        echo "✅ Feeds 更新与安装完成！"

    # ==================== 新增：双重极速编译缓存 ====================
    - name: Cache OpenWrt Toolchain
      id: cache-toolchain
      uses: actions/cache@v4
      with:
        path: |
          /builder/openwrt/staging_dir/host
          /builder/openwrt/staging_dir/hostpkg
          /builder/openwrt/staging_dir/toolchain-*
          /builder/openwrt/build_dir/host
          /builder/openwrt/build_dir/hostpkg
          /builder/openwrt/build_dir/toolchain-*
        key: ${{ runner.os }}-toolchain-immortalwrt-25.12-${{ hashFiles('**/ax6000_immortalwrt_110m_compact.config') }}
        restore-keys: |
          ${{ runner.os }}-toolchain-immortalwrt-25.12-

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: /builder/ccache
        key: ${{ runner.os }}-ccache-ax6000-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-ccache-ax6000-
    # ================================================================
    
    - name: Configuration Customization - Build_ax6000_immortalwrt_110m_compact_25.12
      env:
        PPPOE_USER: ${{ secrets.PPPOE_USER }}
        PPPOE_PASS: ${{ secrets.PPPOE_PASS }}
        CONFIG_FILE: 'ax6000_immortalwrt_110m_compact.config'
      run: |
        # 1. 复制配置文件到 OpenWrt 编译目录
        [ -e "$CONFIG_FILE" ] && cp "$CONFIG_FILE" /builder/openwrt/.config
        
        # 2. 给根目录下的两个自定义脚本赋予执行权限
        [ -e "./customize_immortalwrt.sh" ] && chmod +x ./customize_immortalwrt.sh
        [ -e "./customize.sh" ] && chmod +x ./customize.sh
        
        # 3. 切入到 openwrt 源码目录执行外部脚本
        cd /builder/openwrt
        
        if [ -e "$GITHUB_WORKSPACE/customize_immortalwrt.sh" ]; then
          echo "🚀 正在执行 customize_immortalwrt.sh..."
          $GITHUB_WORKSPACE/customize_immortalwrt.sh
        fi
        
        if [ -e "$GITHUB_WORKSPACE/customize.sh" ]; then
          echo "🚀 正在执行 customize.sh..."
          $GITHUB_WORKSPACE/customize.sh
        fi

        # 4. 强制开启 ccache、禁用 Rust 编译（防 OOM），并关闭多余安装包制作以提速
        cat << 'EOF' >> /builder/openwrt/.config
        CONFIG_CCACHE=y
        # CONFIG_RUST_HOST_BUILD is not set
        # CONFIG_PACKAGE_rust is not set
        # CONFIG_ALL is not set
        # CONFIG_ALL_KMODS is not set
        # CONFIG_ALL_NONSHARED is not set
        # CONFIG_TARGET_ROOTFS_TARGZ is not set
        # CONFIG_TARGET_ROOTFS_EXT4FS is not set
        # CONFIG_TARGET_ROOTFS_INITRAMFS is not set
        EOF
        
        # 5. 刷新并自动补全 .config 依赖
        make defconfig
        
    - name: Download package
      working-directory: /builder/openwrt
      run: |
        make download -j$(nproc)
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Build firmware
      working-directory: /builder/openwrt
      run: |
        echo -e "$(nproc) thread build."
        # 刷新恢复缓存后的文件时间戳，确保 100% 命中缓存不重编工具链
        find /builder/openwrt/staging_dir /builder/openwrt/build_dir -exec touch -c {} + 2>/dev/null || true

        # 多线程静默编译；若失败则单线程编译并将完整日志存入 build.log，屏幕仅打印最后 150 行防止日志截断
        if ! make -j$(nproc); then
          echo "❌ 多线程编译失败，正在单线程定位具体报错..."
          make -j1 V=s > build.log 2>&1 || {
            echo "================ 报错关键日志 ================"
            tail -n 150 build.log
            exit 1
          }
        fi
        ccache -s || true

    - name: Upload build log on failure
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: build-error-log
        path: /builder/openwrt/build.log

    - name: Check Space & Extract Target Firmware
      run: |
        df -h
        mkdir -p /builder/output
        
        # 1. 生成北京时间时间戳（例如：20261114-1410）
        BUILD_DATE=$(TZ=Asia/Shanghai date +%Y%m%d-%H%M)
        echo "BUILD_DATE=${BUILD_DATE}" >> $GITHUB_ENV
        
        # 2. 复制固件到 /builder/output/ 并直接加上时间戳后缀
        for file in /builder/openwrt/bin/targets/mediatek/filogic/*redmi-router-ax6000-110m-squashfs-sysupgrade.bin; do
          if [ -f "$file" ]; then
            filename=$(basename "$file")
            cp -f "$file" "/builder/output/${filename%.bin}-${BUILD_DATE}.bin"
          fi
        done
        
        ls -lh /builder/output/
        
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        # Artifact 压缩包名称也同步加上时间戳
        name: ax6000_immortalwrt_110m_compact_25.12_${{ env.BUILD_DATE }}
        # 匹配带时间戳的新文件名
        path: /builder/output/*redmi-router-ax6000-110m-squashfs-sysupgrade-*.bin
